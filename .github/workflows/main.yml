```yaml
name: Deploy to Teacher Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger aaPanel Webhook
        env:
          WEBHOOK_KEY: ${{ secrets.AAPANEL_WEBHOOK_KEY }}
        run: |
          if [ -z "$WEBHOOK_KEY" ]; then
            echo "Error: AAPANEL_WEBHOOK_KEY belum diatur"
            exit 1
          fi

          curl --globoff -kfsS \
            --retry 2 \
            --retry-delay 3 \
            -X POST \
            --url "https://panel.myriset.my.id:25181/hook?access_key=${WEBHOOK_KEY}"
```
